[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pestana-email-agent"
version = "0.1.0"
description = "Pestana AI Email Agent — local, draft-only, human-in-the-loop email triage pipeline (master's thesis prototype)."
requires-python = ">=3.11"
# Lean core: only what the scaffold + core triage path (agents 1-5) import.
# Heavier phases are optional groups below so the base install stays light on an M1.
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "requests>=2.32",
    "sqlmodel>=0.0.16",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
graph = ["langgraph>=0.2"]                              # agent #11: LangGraph orchestration
rag = ["chromadb>=0.5", "sentence-transformers>=3.0"]  # agent #6: RAG over the FAQ KB
dashboard = ["streamlit>=1.34"]                          # thesis demo dashboard
dev = ["pytest>=8.0", "httpx>=0.27"]                    # tests (+ FastAPI TestClient)

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
